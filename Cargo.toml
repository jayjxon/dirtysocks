[workspace]
resolver = "2"
members = ["dirtysocks", "dirtysocks-bin"]
# Vendored IKEv2 implementation; built as a path dependency, not a member.
exclude = ["vendor/ryke"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false

[profile.profiling]
inherits = "release"
debug = true
