[package]
name = "dirtysocks-bin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
dirtysocks = { path = "../dirtysocks" }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
smoltcp = "0.14.0"
tokio = { version = "1.54.1", features = ["fs", "rt-multi-thread", "time"] }
hickory-resolver = "0.26.3"
boringtun = "0.7.1"
heapless = "0.9.3"
color-eyre = "0.6.5"
rust-ini = "0.21.3"

