[package]
name = "dirtysocks"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54.1", default-features = false, features = [
    "net",
    "macros",
    "sync",
    "time",
    "rt",
] }
hickory-resolver = "0.26.3"
strum = { version = "0.28.0", features = ["derive"] }
untrusted = "0.9.0"
boringtun = "0.7.1"
seq-macro = "0.3.6"
tracing = "0.1.44"
thiserror = "2.0.21"
smallvec = { version = "1.16.5", features = ["union"] }
smoltcp = "0.14.0"
rand = "0.10.3"
futures-util = "0.3.34"
heapless = "0.9.3"
